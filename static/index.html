<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Video Call</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #1a1d24; --surface-2: #252a33;
      --text: #f1f3f6; --muted: #9aa3b2; --accent: #4f8cff;
      --danger: #ef4444; --ok: #22c55e; --warn: #f59e0b; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }

    /* ---------- Lobby ---------- */
    #lobby { min-height: 100%; display: grid; place-items: center; padding: 1.5rem; }
    .card { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--radius); padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    .card h1 { font-size: 1.6rem; margin-bottom: .4rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
    .name-input { width: 100%; font-size: 1rem; padding: .8rem 1rem; margin-bottom: .8rem; border-radius: 12px; border: 2px solid var(--surface-2); background: var(--bg); color: var(--text); }
    .name-input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; font-size: 1rem; font-weight: 600; padding: .85rem 1rem; border: 0; border-radius: 12px; cursor: pointer; color: #fff; background: var(--accent); transition: filter .15s, transform .05s; }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.secondary { background: var(--surface-2); }
    .divider { display: flex; align-items: center; gap: .8rem; color: var(--muted); font-size: .85rem; margin: 1.2rem 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--surface-2); }
    .join-row { display: flex; gap: .6rem; }
    .join-row input { flex: 1; min-width: 0; font-size: 1.1rem; letter-spacing: .15em; text-transform: uppercase; text-align: center; padding: .8rem; border-radius: 12px; border: 2px solid var(--surface-2); background: var(--bg); color: var(--text); }
    .join-row input:focus { outline: none; border-color: var(--accent); }
    .join-row .btn { width: auto; padding: .8rem 1.4rem; }
    #lobbyError { margin-top: 1rem; padding: .7rem .9rem; background: rgba(239,68,68,.12); color: #fca5a5; border-radius: 10px; font-size: .9rem; line-height: 1.4; }
    .invite { margin-bottom: 1.2rem; padding: .7rem .9rem; background: rgba(79,140,255,.12); color: #a9c7ff; border-radius: 10px; font-size: .95rem; }

    /* ---------- Layar panggilan ---------- */
    #call { position: fixed; inset: 0; background: #000; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
    #waiting { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; background: radial-gradient(circle at 50% 40%, #1c2230, #0b0d12); text-align: center; padding: 1.5rem; }
    .pulse { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,140,255,.6); } 100% { box-shadow: 0 0 0 40px rgba(79,140,255,0); } }
    #waitingText { font-size: 1.1rem; }
    #waiting .hint { color: var(--muted); font-size: .9rem; }

    .name-tag { position: absolute; left: 1rem; bottom: 6.5rem; background: rgba(26,29,36,.8); backdrop-filter: blur(8px); padding: .4rem .8rem; border-radius: 999px; font-size: .9rem; }

    .topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: calc(.9rem + env(safe-area-inset-top)) 1rem .9rem; background: linear-gradient(rgba(0,0,0,.55), transparent); }
    .chip { display: inline-flex; align-items: center; gap: .5rem; background: rgba(26,29,36,.8); backdrop-filter: blur(8px); padding: .45rem .8rem; border-radius: 999px; font-size: .9rem; }
    .chip button { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: .25rem .7rem; font-size: .8rem; cursor: pointer; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--danger); }

    #localWrap { position: absolute; right: 1rem; bottom: 6.5rem; width: 180px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #111; border: 2px solid rgba(255,255,255,.15); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #camOffLabel { position: absolute; inset: 0; display: none; place-items: center; background: #14171d; color: var(--muted); font-size: .85rem; text-align: center; }
    #localWrap.cam-off #camOffLabel { display: grid; }

    .controls { position: absolute; left: 0; right: 0; bottom: calc(1.2rem + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 1rem; }
    .ctrl { width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: rgba(37,42,51,.9); color: #fff; backdrop-filter: blur(8px); transition: transform .1s, background .15s; }
    .ctrl:hover { transform: scale(1.08); }
    .ctrl.off { background: #fff; color: #111; }
    .ctrl.hangup { background: var(--danger); }
    .ctrl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    #toast { position: absolute; left: 50%; top: 4.5rem; transform: translateX(-50%); background: rgba(26,29,36,.95); padding: .6rem 1rem; border-radius: 10px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #toast.show { opacity: 1; }

    @media (max-width: 600px) {
      #localWrap { width: 110px; bottom: 6rem; right: .7rem; }
      .name-tag { bottom: 6rem; left: .7rem; }
      .ctrl { width: 52px; height: 52px; }
    }

    .local-name { position: absolute; left: .4rem; bottom: .4rem; background: rgba(0,0,0,.6); padding: .15rem .55rem; border-radius: 999px; font-size: .75rem; }
  </style>
</head>
<body>

  <!-- ===== LOBBY ===== -->
  <main id="lobby">
    <div class="card">
      <h1>Video Call</h1>
      <p class="sub">Ngobrol tatap muka langsung dari browser. Tanpa akun, tanpa instalasi.</p>
      <div id="invite" class="invite" hidden></div>
      <input id="nameInput" class="name-input" placeholder="Nama kamu" maxlength="30" autocomplete="off">
      <button id="btnCreate" class="btn">Buat room baru</button>
      <div class="divider">atau gabung ke room</div>
      <div class="join-row">
        <input id="roomInput" placeholder="KODE" maxlength="6" autocomplete="off">
        <button id="btnJoin" class="btn secondary">Gabung</button>
      </div>
      <p id="lobbyError" hidden></p>
    </div>
  </main>

  <!-- ===== LAYAR PANGGILAN ===== -->
  <section id="call" hidden>
    <video id="remoteVideo" autoplay playsinline></video>

    <div id="waiting">
      <div class="pulse"></div>
      <p id="waitingText">Menunggu peserta lain...</p>
      <p class="hint">Bagikan link room lewat tombol "Salin link" di kiri atas</p>
    </div>

    <div id="remoteLabel" class="name-tag" hidden></div>

    <div class="topbar">
      <div class="chip">
        <span id="roomLabel">Room</span>
        <button id="btnCopy">Salin link</button>
      </div>
      <div class="chip"><span id="dot" class="dot"></span><span id="statusText">Menyambungkan</span></div>
    </div>

    <div id="localWrap">
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="camOffLabel">Kamera mati</div>
    <div id="localName" class="local-name"></div>
    </div>

    <div id="toast"></div>

    <div class="controls">
      <button id="btnMute" class="ctrl" title="Mikrofon"></button>
      <button id="btnCam" class="ctrl" title="Kamera"></button>
      <button id="btnLeave" class="ctrl hangup" title="Keluar"></button>
    </div>
  </section>

  <script>
    // ---------- Ikon SVG ----------
    const ICONS = {
      mic: '<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
      micOff: '<svg viewBox="0 0 24 24"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
      cam: '<svg viewBox="0 0 24 24"><path d="m16 13 5.22 3.48a.5.5 0 0 0 .78-.42V7.87a.5.5 0 0 0-.75-.43L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
      camOff: '<svg viewBox="0 0 24 24"><path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.25-3.5a.5.5 0 0 1 .75.43v8.14"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2"/><line x1="2" x2="22" y1="2" y2="22"/></svg>',
      hangup: '<svg viewBox="0 0 24 24" style="transform: rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    };

    const ROLE_LABEL = { interviewer: "Pewawancara", candidate: "Kandidat" };

    const $ = (id) => document.getElementById(id);
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    let ws, pc, localStream;
    let currentRoom = "";

    // ---------- Fungsi tampilan ----------
    function showLobbyError(text) {
      $("lobbyError").textContent = text;
      $("lobbyError").hidden = !text;
    }

    function toast(text) {
      const el = $("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 3000);
    }

    function setStatus(kind, text) {
      $("statusText").textContent = text;
      $("dot").className = "dot" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
    }

    function showWaiting(text) {
      $("waitingText").textContent = text;
      $("waiting").hidden = false;
    }

    function resetControls() {
      $("btnMute").innerHTML = ICONS.mic;
      $("btnMute").classList.remove("off");
      $("btnCam").innerHTML = ICONS.cam;
      $("btnCam").classList.remove("off");
      $("btnLeave").innerHTML = ICONS.hangup;
      $("localWrap").classList.remove("cam-off");
    }

    function setLobbyBusy(busy) {
      $("btnCreate").disabled = busy;
      $("btnJoin").disabled = busy;
    }

    function getName() {
      const name = $("nameInput").value.trim();
      if (!name) { showLobbyError("Isi nama kamu dulu."); return null; }
      return name;
    }

    function setRemoteLabel(name, role) {
      $("remoteLabel").textContent = `${name} · ${ROLE_LABEL[role] || ""}`;
      $("remoteLabel").hidden = false;
    }

    // ---------- Masuk dan keluar ----------
    async function start(firstMessage) {
      showLobbyError("");
      setLobbyBusy(true);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (e) {
        showLobbyError(
          e.name === "NotAllowedError" ? "Izin kamera/mikrofon ditolak. Izinkan lewat ikon gembok di address bar, lalu coba lagi."
          : e.name === "NotFoundError" ? "Kamera atau mikrofon tidak ditemukan di perangkat ini."
          : e.name === "NotReadableError" ? "Kamera sedang dipakai aplikasi atau tab lain."
          : "Gagal mengakses kamera/mikrofon: " + e.message
        );
        setLobbyBusy(false);
        return;
      }

      $("localVideo").srcObject = localStream;
      currentRoom = firstMessage.room || "";
      const myRole = firstMessage.type === "create" ? "interviewer" : "candidate";
      $("localName").textContent = `${firstMessage.name} · ${ROLE_LABEL[myRole]}`;    

      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify(firstMessage));
        resetControls();
        setStatus("wait", "Menyambungkan");
        showWaiting("Menunggu peserta lain...");
        $("roomLabel").textContent = currentRoom ? "Room " + currentRoom : "Room";
        $("lobby").hidden = true;
        $("call").hidden = false;
      };

      // Pesan diproses berurutan supaya offer dan ice tidak tertukar
      let queue = Promise.resolve();
      ws.onmessage = (e) => {
        queue = queue.then(() => handleMessage(JSON.parse(e.data))).catch(console.error);
      };

      ws.onerror = () => cleanup("Tidak bisa terhubung ke server.");
      ws.onclose = () => cleanup("Koneksi ke server terputus.");
    }

    // Kembali ke lobby dan bersihkan semuanya
    function cleanup(message) {
      if (ws) {
        ws.onclose = null; // cegah cleanup berulang
        ws.onerror = null;
        ws.close();
        ws = null;
      }
      closePeer();
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      $("localVideo").srcObject = null;
      $("remoteLabel").hidden = true;
      $("call").hidden = true;
      $("lobby").hidden = false;
      setLobbyBusy(false);
      showLobbyError(message || "");
      history.replaceState(null, "", location.pathname); // hapus #KODE dari address bar
    }

    // ---------- WebRTC ----------
    function sendSignal(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function createPeer() {
      closePeer();
      pc = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

      pc.ontrack = (e) => {
        $("remoteVideo").srcObject = e.streams[0];
        $("waiting").hidden = true;
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) sendSignal({ type: "ice", candidate: e.candidate.toJSON() });
      };

      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === "connected") setStatus("ok", "Terhubung");
        else if (s === "failed" || s === "disconnected") setStatus("bad", "Terputus");
        else setStatus("wait", "Menyambungkan");
      };
    }

    function closePeer() {
      if (pc) { pc.close(); pc = null; }
      $("remoteVideo").srcObject = null;
    }

    async function handleMessage(msg) {
      switch (msg.type) {
        case "created":
          currentRoom = msg.room;
          $("roomLabel").textContent = "Room " + msg.room;
          history.replaceState(null, "", "#" + msg.room); // address bar jadi link yang bisa dibagikan
          break;

        case "joined":
          // Kita yang baru masuk: tampilkan nama orang yang sudah ada di room
          setRemoteLabel(msg.name, msg.role);
          break;

        case "peer-joined": {
          // Kita yang sudah di room duluan: buat offer
          setRemoteLabel(msg.name, msg.role);
          toast(`${msg.name} bergabung`);
          setStatus("wait", "Menyambungkan");
          createPeer();
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendSignal({ type: "offer", sdp: offer.sdp });
          break;
        }

        case "offer": {
          // Kita yang baru join: terima offer, balas answer
          createPeer();
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal({ type: "answer", sdp: answer.sdp });
          break;
        }

        case "answer":
          if (pc) await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          break;

        case "ice":
          if (pc) await pc.addIceCandidate(msg.candidate);
          break;

        case "peer-left":
          closePeer();
          $("remoteLabel").hidden = true;
          setStatus("wait", "Menunggu peserta");
          showWaiting("Lawan bicara keluar. Menunggu peserta lain...");
          toast("Lawan bicara keluar");
          break;

        case "error": {
          const pesan =
            msg.message === "room tidak ditemukan" ? "Room tidak ditemukan. Periksa kembali kodenya."
            : msg.message === "room penuh" ? "Room sudah penuh (maksimal 2 peserta)."
            : msg.message === "nama harus 1-30 karakter" ? "Nama harus 1-30 karakter."
            : "Terjadi kesalahan: " + msg.message;
          cleanup(pesan);
          break;
        }
      }
    }

    // ---------- Tombol ----------
    $("btnCreate").onclick = () => {
      const name = getName();
      if (name) start({ type: "create", name });
    };

    function joinFromInput() {
      const name = getName();
      if (!name) return;
      const room = $("roomInput").value.trim().toUpperCase();
      if (room.length !== 6) { showLobbyError("Kode room terdiri dari 6 karakter."); return; }
      history.replaceState(null, "", "#" + room);
      start({ type: "join", room, name });
    }
    $("btnJoin").onclick = joinFromInput;
    $("roomInput").onkeydown = (e) => { if (e.key === "Enter") joinFromInput(); };

    $("btnMute").onclick = () => {
      const track = localStream.getAudioTracks()[0];
      track.enabled = !track.enabled;
      $("btnMute").innerHTML = track.enabled ? ICONS.mic : ICONS.micOff;
      $("btnMute").classList.toggle("off", !track.enabled);
    };

    $("btnCam").onclick = () => {
      const track = localStream.getVideoTracks()[0];
      track.enabled = !track.enabled;
      $("btnCam").innerHTML = track.enabled ? ICONS.cam : ICONS.camOff;
      $("btnCam").classList.toggle("off", !track.enabled);
      $("localWrap").classList.toggle("cam-off", !track.enabled);
    };

    $("btnLeave").onclick = () => cleanup("");

    $("btnCopy").onclick = async () => {
      const link = `${location.origin}/#${currentRoom}`;
      try {
        await navigator.clipboard.writeText(link);
        toast("Link disalin");
      } catch {
        prompt("Salin link ini:", link);
      }
    };

    // ---------- Saat halaman dibuka ----------
    // Kalau dibuka lewat link berisi #KODE, isi otomatis kolom kode
    const kodeDariLink = location.hash.slice(1).toUpperCase();
    if (kodeDariLink) {
      $("roomInput").value = kodeDariLink;
      $("invite").textContent = `Kamu diundang ke room ${kodeDariLink}. Isi namamu, lalu tekan "Gabung".`;
      $("invite").hidden = false;
    }
  </script>
</body>
</html>
